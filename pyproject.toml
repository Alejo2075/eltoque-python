[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eltoque-python"
dynamic = ["version"]
description = "Unofficial, typed Python client for the official elTOQUE exchange-rate API."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "eltoque-python contributors" }]
keywords = ["eltoque", "exchange-rate", "cuba", "api-client", "httpx", "async"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.28,<1"]

[project.urls]
Documentation = "https://tasas.eltoque.com/docs/"

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "ruff",
  "mypy",
  "build",
  "twine",
]

[tool.hatch.version]
path = "src/eltoque/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/eltoque"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/examples", "/README.md", "/LICENSE", "/CHANGELOG.md"]
