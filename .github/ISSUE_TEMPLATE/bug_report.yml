name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste your API token or real provider responses.** Replace them with placeholders.
        Security issues: use private vulnerability reporting instead (see SECURITY.md).
  - type: input
    id: version
    attributes:
      label: eltoque-python version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version and OS
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Client
      options: [ElToqueClient (sync), AsyncElToqueClient (async), Both]
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Use a fake token and a mocked transport if possible.
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual behavior
    validations:
      required: true
